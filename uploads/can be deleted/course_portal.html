    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-sidebar: #111827;
            --bg-card: #1f2937;
            --bg-card-hover: #283548;
            --border: #374151;
            --primary: #3b82f6;
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            --accent-folder: #f59e0b;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --text-muted: #6b7280;
            --badge-bg: #1e3a8a;
            --radius-lg: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        aside {
            width: 380px;
            min-width: 350px;
            max-width: 420px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 20;
        }

        .sidebar-header {
            padding: 20px 18px 14px;
            background: #0d131f;
            border-bottom: 1px solid var(--border);
        }

        .channel-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .channel-logo {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #fff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            flex-shrink: 0;
        }

        .channel-details h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
        }

        .channel-details p {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 3px;
        }

        .search-container {
            position: relative;
        }

        .search-container i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            background-color: #1a2332;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.88rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background-color: #1f2c3f;
        }

        .category-tabs {
            display: flex;
            gap: 6px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            background: #101726;
            overflow-x: auto;
        }

        .category-tabs::-webkit-scrollbar {
            height: 4px;
        }
        .category-tabs::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 2px;
        }

        .cat-tab {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            background: transparent;
            color: var(--text-sub);
            border: 1px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .cat-tab:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.05);
        }

        .cat-tab.active {
            background: var(--primary);
            color: white;
        }

        .folder-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .folder-list::-webkit-scrollbar {
            width: 6px;
        }
        .folder-list::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }

        .folder-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 14px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            background: rgba(31, 41, 55, 0.25);
        }

        .folder-item:hover {
            background-color: var(--bg-card);
            border-color: var(--border);
            transform: translateX(2px);
        }

        .folder-item.active {
            background-color: #1e293b;
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .folder-title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .folder-icon {
            font-size: 1.2rem;
            color: var(--accent-folder);
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .folder-item.active .folder-icon {
            transform: scale(1.15);
        }

        .folder-name {
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .folder-badge {
            background: #1f2937;
            color: #93c5fd;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 12px;
            flex-shrink: 0;
            border: 1px solid rgba(147, 197, 253, 0.2);
        }

        .folder-item.active .folder-badge {
            background: var(--primary);
            color: #fff;
            border-color: transparent;
        }

        /* Main Content Styling */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 80% 20%, #151e32 0%, var(--bg-body) 60%);
        }

        .main-header {
            padding: 18px 28px;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .current-topic-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .topic-folder-icon {
            font-size: 2.2rem;
            color: var(--accent-folder);
        }

        .topic-title-area h2 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
        }

        .topic-title-area p {
            font-size: 0.82rem;
            color: var(--text-sub);
            margin-top: 3px;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: #1e293b;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        .stat-pill i {
            color: var(--primary);
        }

        .scrollable-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
        }

        .scrollable-body::-webkit-scrollbar {
            width: 8px;
        }
        .scrollable-body::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }

        /* YouTube Playlist Card Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-decoration: none;
            color: inherit;
            position: relative;
        }

        .video-card:hover {
            transform: translateY(-4px);
            border-color: #4b5563;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
            background: var(--bg-card-hover);
        }

        /* Thumbnail Banner */
        .video-thumb {
            position: relative;
            width: 100%;
            height: 165px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .thumb-pattern {
            position: absolute;
            inset: 0;
            opacity: 0.08;
            background-image: radial-gradient(#3b82f6 1px, transparent 1px);
            background-size: 16px 16px;
        }

        .play-btn-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.9);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            padding-left: 3px;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
            transition: all 0.25s ease;
            z-index: 2;
        }

        .video-card:hover .play-btn-circle {
            transform: scale(1.15);
            background: #ff0000;
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.8);
        }

        .thumb-index-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            color: #e2e8f0;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 2;
        }

        .thumb-media-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 3px 7px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 2;
        }

        .video-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .video-title {
            font-size: 0.96rem;
            font-weight: 600;
            color: #f3f4f6;
            line-height: 1.45;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-meta {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: auto;
        }

        .meta-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 6px;
        }

        .tag {
            font-size: 0.72rem;
            background: rgba(55, 65, 81, 0.6);
            color: #d1d5db;
            padding: 2px 7px;
            border-radius: 4px;
            white-space: nowrap;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tag.batch-tag {
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.25);
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .date-info {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .watch-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.8rem;
            transition: color 0.2s;
        }

        .video-card:hover .watch-link-btn {
            color: #60a5fa;
            text-decoration: underline;
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3.5rem;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .empty-state h3 {
            font-size: 1.15rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        @media (max-width: 900px) {
            body {
                flex-direction: column;
            }
            aside {
                width: 100%;
                max-width: 100%;
                height: 40vh;
            }
            main {
                height: 60vh;
            }
        }
    </style>
</head>

                if (idx >= 75 && idx <= 76) return 'साझेदारी (Partnership)';
                if (idx >= 77 && idx <= 84) return 'सरल ब्याज (Simple Interest)';
                if (idx >= 85 && idx <= 87) return 'चक्रवृद्धि ब्याज (Compound Interest)';
            }

            if (topic.includes('REASONING')) return 'रीजनिंग: सामान्य (Reasoning)';
            return 'संख्या पद्धति (Number System)';
        }

        // State variables
        let foldersMap = {};
        let activeFolder = null;
        let searchQuery = '';
        let currentTabFilter = 'all';

        // Pre-order for important folders
        const priorityOrder = [
            'लघुगणक (Logarithm)',
            'अनुपात - समानुपात (Ratio & Proportion)',
            'प्रतिशत (Percentage)',
            'लाभ और हानि (Profit & Loss)',
            'बट्टा (Discount)',
            'साझेदारी (Partnership)',
            'सरल ब्याज (Simple Interest)',
            'चक्रवृद्धि ब्याज (Compound Interest)',
            'औसत (Average)',
            'ऐकिक नियम (Unitary Method)',
            'समय एवं कार्य (Time & Work)',
            'पाइप एवं टंकी (Pipe & Cistern)',
            'चाल, समय और दूरी (Speed, Time & Distance)',
            'संख्या पद्धति (Number System)',
            'सरलीकरण एवं भिन्न (Simplification & Fractions)',
            'ल.स.प. एवं म.स.प. (LCM & HCF)',
            'वैदिक गणित (Vedic Maths)',
            'बीजगणित एवं बहुपद (Algebra & Polynomials)',
            'क्षेत्रमिति (Area & Volume)',
            'ज्यामिति (Geometry)',
            'निर्देशांक ज्यामिति (Coordinate Geometry)',
            'त्रिकोणमिति (Trigonometry)',
            'सांख्यिकी (Statistics)',
            'प्रायिकता (Probability)',
            'क्रमचय एवं संचय (Permutation & Combination)'
        ];

        // Process data into folders
        function initData() {
            foldersMap = {};
            courseData.videos.forEach((v, idx) => {
                const folder = getSubjectFolder(v, idx);
                if (!foldersMap[folder]) {
                    foldersMap[folder] = [];
                }
                foldersMap[folder].push(v);
            });

            // Update channel header
            document.getElementById('channelName').textContent = courseData.channel_name || "Math's & Reasoning";
            document.getElementById('channelStats').textContent = `${courseData.videos.length} कुल Videos • ${Object.keys(foldersMap).length} Topic Folders`;

            // Default active folder
            const allFolders = getFilteredFolderKeys();
            if (allFolders.length > 0) {
                // Pre-select Logarithm or Ratio as requested by user
                activeFolder = allFolders.find(f => f.includes('Logarithm')) || allFolders.find(f => f.includes('अनुपात')) || allFolders[0];
            }

            renderFolders();
            renderVideos();
        }

        function getFilteredFolderKeys() {
            let keys = Object.keys(foldersMap);

            // Tab filtering
            if (currentTabFilter === 'math') {
                keys = keys.filter(k => !k.startsWith('रीजनिंग') && !k.includes('शिक्षण'));
            } else if (currentTabFilter === 'reasoning') {
                keys = keys.filter(k => k.startsWith('रीजनिंग'));
            } else if (currentTabFilter === 'teaching') {
                keys = keys.filter(k => k.includes('शिक्षण'));
            }

            // Search query filter
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                keys = keys.filter(k => {
                    const matchFolderName = k.toLowerCase().includes(q);
                    const matchVideoTitle = foldersMap[k].some(v => (v.title || '').toLowerCase().includes(q));
                    return matchFolderName || matchVideoTitle;
                });
            }

            // Custom sort with priority order first, then alphabetical
            keys.sort((a, b) => {
                let pA = priorityOrder.indexOf(a);
                let pB = priorityOrder.indexOf(b);
                if (pA !== -1 && pB !== -1) return pA - pB;
                if (pA !== -1) return -1;
                if (pB !== -1) return 1;
                return a.localeCompare(b, 'hi');
            });

            return keys;
        }

        function renderFolders() {
            const listEl = document.getElementById('folderList');
            const keys = getFilteredFolderKeys();
            listEl.innerHTML = '';

            if (keys.length === 0) {
                listEl.innerHTML = '<div style="padding: 24px; text-align: center; color: var(--text-muted); font-size: 0.85rem;"><i class="fa-regular fa-folder-open" style="font-size: 2rem; margin-bottom: 8px; opacity: 0.5;"></i><br>कोई फोल्डर नहीं मिला</div>';
                return;
            }

            keys.forEach(folderName => {
                const vids = foldersMap[folderName] || [];
                const item = document.createElement('div');
                item.className = `folder-item ${activeFolder === folderName ? 'active' : ''}`;
                
                // Choose icon based on topic
                let iconClass = 'fa-folder';
                if (activeFolder === folderName) iconClass = 'fa-folder-open';
                if (folderName.startsWith('रीजनिंग')) iconClass = 'fa-brain';

                item.innerHTML = `
                    <div class="folder-title-wrap">
                        <i class="fa-solid ${iconClass} folder-icon"></i>
                        <span class="folder-name" title="${folderName}">${folderName}</span>
                    </div>
                    <span class="folder-badge">${vids.length}</span>
                `;

                item.onclick = () => {
                    activeFolder = folderName;
                    renderFolders();
                    renderVideos();
                };

                listEl.appendChild(item);
            });
        }

        function renderVideos() {
            const gridEl = document.getElementById('videoGrid');
            const titleEl = document.getElementById('activeFolderName');
            const descEl = document.getElementById('activeFolderDesc');
            const countEl = document.getElementById('activeVideoCount');

            if (!activeFolder || !foldersMap[activeFolder]) {
                titleEl.textContent = 'फोल्डर चुनें';
                descEl.textContent = 'कृपया बाईं सूची में से किसी टॉपिक फोल्डर पर क्लिक करें।';
                countEl.textContent = '0 Videos';
                gridEl.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-folder-closed"></i>
                        <h3>कोई फोल्डर चयनित नहीं है</h3>
                        <p>बाईं सूची में से अनुपात, लॉग या किसी भी टॉपिक फोल्डर पर क्लिक करें।</p>
                    </div>
                `;
                return;
            }

            titleEl.textContent = activeFolder;
            descEl.textContent = `इस फोल्डर में कुल ${foldersMap[activeFolder].length} क्लासेज और लेक्चर्स उपलब्ध हैं।`;

            let videos = foldersMap[activeFolder];
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                videos = videos.filter(v => (v.title || '').toLowerCase().includes(q) || activeFolder.toLowerCase().includes(q));
            }

            countEl.textContent = `${videos.length} Videos`;

            if (videos.length === 0) {
                gridEl.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-video-slash"></i>
                        <h3>इस फोल्डर में कोई वीडियो नहीं मिली</h3>
                        <p>अपनी सर्च क्वेरी बदलकर देखें।</p>
                    </div>
                `;
                return;
            }

            gridEl.innerHTML = '';
            videos.forEach((v, indexInFolder) => {
                const card = document.createElement('a');
                card.className = 'video-card';
                card.href = v.channel_url || '#';
                card.target = '_blank';
                card.rel = 'noopener noreferrer';

                // Display index
                const displayIndex = v.index ? `#${v.index}` : `Part ${indexInFolder + 1}`;
                const topicTag = v.topic || 'Class';

                card.innerHTML = `
                    <div class="video-thumb">
                        <div class="thumb-pattern"></div>
                        <span class="thumb-index-badge"><i class="fa-solid fa-list-ol"></i> ${displayIndex}</span>
                        <div class="play-btn-circle">
                            <i class="fa-solid fa-play"></i>
                        </div>
                        <span class="thumb-media-badge"><i class="fa-solid fa-film"></i> Video</span>
                    </div>
                    <div class="video-info">
                        <div>
                            <div class="meta-tags">
                                <span class="tag batch-tag" title="${v.batch || ''}"><i class="fa-solid fa-layer-group"></i> ${topicTag}</span>
                            </div>
                            <div class="video-title" title="${v.title}">${v.title}</div>
                        </div>
                        <div class="video-meta">
                            <div class="card-footer">
                                <span class="date-info"><i class="fa-regular fa-clock"></i> ${v.timestamp || '2025-26'}</span>
                                <span class="watch-link-btn">देखें <i class="fa-solid fa-arrow-up-right-from-square"></i></span>
                            </div>
                        </div>
                    </div>
                `;

                gridEl.appendChild(card);
            });
        }

        function onSearchInput(val) {
            searchQuery = val.trim();
            const keys = getFilteredFolderKeys();
            if (keys.length > 0 && !keys.includes(activeFolder)) {
                activeFolder = keys[0];
            }
            renderFolders();
            renderVideos();
        }

        function setCategoryFilter(cat) {
            currentTabFilter = cat;
            document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const keys = getFilteredFolderKeys();
            if (keys.length > 0 && !keys.includes(activeFolder)) {
                activeFolder = keys[0];
            }
            renderFolders();
            renderVideos();
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', initData);
    </script>
</body>
</html>
